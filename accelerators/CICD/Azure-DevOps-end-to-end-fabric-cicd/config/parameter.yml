# =============================================================================
# fabric-cicd parameter file
# -----------------------------------------------------------------------------
# The repository holds the *feature/dev* version of every item. When the
# pipeline publishes to Test or Prod, fabric-cicd rewrites the values below so
# items point at the right workspace, lakehouse, connection and so on.
#
# Environment keys (DEV, TEST, PROD) must match `fabricEnvironment` in
# pipelines/variables/<env>.yml. The CI pipeline fails if an entry does not
# provide a value for every promoted environment.
#
# Dynamic variables you can use in replace_value:
#   $workspace.$id                              id of the workspace being deployed to
#   $items.<ItemType>.<Item Name>.$id           id of an item after it was published
#   $ENV:<pipeline_variable_name>               a pipeline/environment variable
#
# Reference: https://microsoft.github.io/fabric-cicd/latest/how_to/parameterization/
# =============================================================================

find_replace:
  # Notebooks and pipelines that reference the Dev lakehouse by id.
  - find_value: "11111111-1111-1111-1111-111111111111"          # Dev lakehouse id (as exported)
    replace_value:
      DEV: "11111111-1111-1111-1111-111111111111"
      TEST: "$items.Lakehouse.lh_sales.$id"                    # resolved after the lakehouse is published
      PROD: "$items.Lakehouse.lh_sales.$id"
    item_type: ["Notebook", "DataPipeline"]

  # Workspace id embedded in notebook metadata and pipeline activities.
  - find_value: "22222222-2222-2222-2222-222222222222"          # Dev workspace id (as exported)
    replace_value:
      DEV: "22222222-2222-2222-2222-222222222222"
      TEST: "$workspace.$id"
      PROD: "$workspace.$id"

  # Example for a semantic model that connects to the SQL analytics endpoint
  # of the lakehouse. The Test/Prod endpoints come from pipeline variables
  # (SQL_ENDPOINT_TEST / SQL_ENDPOINT_PROD in a variable group) so they never
  # need to be committed. Uncomment once you have a semantic model in scope.
  # - find_value: "abcdefghijklmnop-dev.datawarehouse.fabric.microsoft.com"
  #   replace_value:
  #     DEV: "abcdefghijklmnop-dev.datawarehouse.fabric.microsoft.com"
  #     TEST: "$ENV:SQL_ENDPOINT_TEST"
  #     PROD: "$ENV:SQL_ENDPOINT_PROD"
  #   item_type: "SemanticModel"

key_value_replace:
  # Disable pipeline schedules everywhere except Prod.
  - find_key: $.schedules[?(@.jobType=="Execute")].enabled
    replace_value:
      DEV: false
      TEST: false
      PROD: true
    file_path: "**/.schedules"

  # Re-point the "Run Notebook" activity in data pipelines to the notebook
  # deployed in the target workspace.
  - find_key: $.properties.activities[?(@.name=="Run Notebook")].typeProperties.workspaceId
    replace_value:
      DEV: "$workspace.$id"
      TEST: "$workspace.$id"
      PROD: "$workspace.$id"
    item_type: "DataPipeline"

